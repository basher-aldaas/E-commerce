services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce-app
    container_name: ecommerce-app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment: &app-environment
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: E-commerce
      DB_USERNAME: root
      DB_PASSWORD: ""
      # MySQL read replica (Requirement 3). Empty = no replica, every read on the
      # primary. With the replica running (`docker compose --profile replica up -d`),
      # start the app with `DB_READ_HOST=mysql-replica docker compose up -d app`:
      # catalog cache misses and bypasses then read the replica, everything else
      # (writes, auth, orders) stays on the primary
      # (Modules\Products\Services\CatalogCache). Setup: docs/performance/DEMO.md.
      DB_READ_HOST: ${DB_READ_HOST:-}
      WAREHOUSE_GRPC_ENABLED: "true"
      WAREHOUSE_GRPC_TARGET: warehouse:50051
      # The order confirmation email does NOT go through Laravel's queue: it is an
      # order.created event in the transactional outbox, published by
      # outbox-relay and sent by email-worker (Requirement 4). The API never
      # sends that email itself. The remaining mails (welcome, status change)
      # still run in the request and are only written to storage/logs/laravel.log.
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      # `php artisan serve` handles one request at a time unless PHP's built-in
      # server runs several workers; 8 lets concurrent orders really overlap.
      PHP_CLI_SERVER_WORKERS: 8
      # 0 = OPcache never re-checks files: stable timings for demos and the cache
      # benchmark, but run `docker compose restart app` after editing PHP code.
      # Set to 1 to pick up code edits immediately (each request then gets
      # ~1-2 s slower on a Windows bind mount). See the Dockerfile.
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: 0
      # Catalog cache for the v1/v2 product endpoints (Requirement 3). Set to
      # false (`PRODUCT_CACHE_ENABLED=false docker compose up -d app`) to measure the uncached
      # baseline with the same requests; responses then carry X-Cache: OFF.
      PRODUCT_CACHE_ENABLED: ${PRODUCT_CACHE_ENABLED:-true}
      PRODUCT_CACHE_TTL: 300
      # Per-user API rate limit (requests/minute). Keep 60 normally; for a load
      # test or the Postman cache comparison start the app with e.g.
      # `API_RATE_LIMIT_PER_MINUTE=100000 docker compose up -d app`.
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-60}
      # Shared application cache (catalog cache, rate limiter, scheduler locks).
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # RabbitMQ (Requirement 4). The API never talks to RabbitMQ: placing an
      # order only writes an outbox row in MySQL. outbox-relay publishes it.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-ecommerce}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      warehouse:
        condition: service_healthy

  # Runs Laravel's scheduler: `warehouse:reconcile` every minute, which releases
  # reservations whose compensation or cancellation could not reach the
  # Warehouse at the time. Exactly one scheduler container; the task also uses
  # withoutOverlapping() + onOneServer(), backed by the shared Redis cache
  # lock, so a run never starts while another is still going.
  scheduler:
    image: ecommerce-app
    container_name: ecommerce-scheduler
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment: *app-environment
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Application cache (Requirement 3). No published port: only the Laravel
  # containers use it. Data is a cache, so no volume: losing it is harmless.
  redis:
    image: redis:7.4-alpine
    container_name: ecommerce-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Message broker (Requirement 4). Official image with the management plugin:
  # UI at http://localhost:15672 (bound to 127.0.0.1 only). AMQP (5672) is not
  # published; only the containers on this network use it.
  # hostname is fixed on purpose: RabbitMQ stores its data under the node name
  # rabbit@<hostname>, so a recreated container with a random hostname would
  # start empty even though the volume is still there.
  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: ecommerce-rabbitmq
    hostname: ecommerce-rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    environment:
      # Credentials come from .env (never committed). Compose refuses to start
      # without a password, so no default password can end up in use.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ecommerce}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      # Durable queues, persistent messages, users and vhosts live here, so they
      # survive `docker compose down` / container recreation (not `down -v`).
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # Healthy only once the node is running and accepts AMQP connections.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Transactional outbox relay (Requirement 4). Reads unpublished rows from
  # outbox_messages (written in the same transaction as the order) and
  # publishes them to RabbitMQ as persistent messages with publisher confirms.
  # A row is marked published only after the broker confirmed it, so stopping
  # this container, RabbitMQ or the app never loses an event: rows just wait.
  outbox-relay:
    image: ecommerce-app
    container_name: ecommerce-outbox-relay
    command: ["php", "artisan", "outbox:relay"]
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment: *app-environment
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Order confirmation email worker (Requirement 4). Separate from the API: it
  # only needs RabbitMQ and SMTP, no database. It consumes order.created with
  # manual ACKs and sends the email through the SMTP server configured by the
  # MAIL_* variables in .env (e.g. Mailtrap). Stop/start it freely:
  #   docker compose stop email-worker    /    docker compose start email-worker
  email-worker:
    image: ecommerce-app
    container_name: ecommerce-email-worker
    command: ["php", "artisan", "notifications:consume-order-created"]
    restart: unless-stopped
    # Give an in-flight email time to finish on `docker compose stop`; the
    # worker stops after the current message (SIGTERM handler).
    stop_grace_period: 30s
    volumes:
      - .:/var/www/html
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-ecommerce}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: 0
      # The worker never needs the cache; keep it off Redis and the database.
      CACHE_STORE: array
      # MAIL_MAILER, MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD,
      # MAIL_FROM_ADDRESS and MAIL_FROM_NAME are read from .env.
    depends_on:
      rabbitmq:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    # GTID replication source for the optional read replica below. Binary
    # logging is already on by default in MySQL 8; server-id 1 is explicit.
    command: ["--server-id=1", "--gtid-mode=ON", "--enforce-gtid-consistency=ON"]
    ports:
      - "3307:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: E-commerce
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional MySQL read replica (Requirement 3). Not started by default; only
  # with `docker compose --profile replica up -d mysql-replica`. It copies the
  # primary through GTID replication and is read-only. One-time setup (copy the
  # data, point it at the primary) is in docs/performance/DEMO.md.
  mysql-replica:
    image: mysql:8.0
    container_name: ecommerce-mysql-replica
    profiles: ["replica"]
    command: ["--server-id=2", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--relay-log=relay-bin"]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql-replica-data:/var/lib/mysql
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The Warehouse gRPC service (separate repo). No "ports:" on purpose:
  # only containers on this network can reach it, users go through Laravel.
  warehouse:
    build:
      context: ${WAREHOUSE_SERVICE_PATH:-../../warehouse-service}
    container_name: ecommerce-warehouse
    environment:
      WAREHOUSE_DB_HOST: warehouse-mysql
      WAREHOUSE_DB_PORT: 3306
      WAREHOUSE_DB_USER: warehouse
      WAREHOUSE_DB_PASSWORD: warehouse
      WAREHOUSE_DB_NAME: warehouse
    depends_on:
      warehouse-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.channel_ready_future(grpc.insecure_channel('127.0.0.1:50051')).result(timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Warehouse data lives in its own MySQL server and volume, never in
  # Laravel's database. The "warehouse" user can only see this database.
  warehouse-mysql:
    image: mysql:8.0
    container_name: ecommerce-warehouse-mysql
    # Bound to 127.0.0.1 only, for the Laravel integration tests run from the
    # host (tests/Integration). Users still reach stock only through Laravel; the
    # gRPC service itself publishes no port.
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: warehouse
      MYSQL_USER: warehouse
      MYSQL_PASSWORD: warehouse
    volumes:
      - warehouse-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # phpMyAdmin at http://localhost:8080. Choose the server on the login page:
  #   mysql           -> Laravel DB    (user root, empty password)
  #   warehouse-mysql -> Warehouse DB  (user warehouse, password warehouse)
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: ecommerce-phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOSTS: mysql,warehouse-mysql,mysql-replica
      PMA_ARBITRARY: 0
    volumes:
      - ./docker/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
    depends_on:
      - mysql
      - warehouse-mysql

volumes:
  mysql-data:
  mysql-replica-data:
  warehouse-mysql-data:
  rabbitmq-data:
