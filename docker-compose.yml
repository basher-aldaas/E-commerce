x-app-instance: &app-instance
  image: ecommerce-app
  command: ["sh", "docker/entrypoint.sh", "serve"]
  restart: unless-stopped
  volumes:
    - .:/var/www/html


  environment: &app-environment
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: E-commerce
    DB_USERNAME: root
    DB_PASSWORD: ""
    DB_READ_HOST: ${DB_READ_HOST:-}
    WAREHOUSE_GRPC_ENABLED: "true"
    WAREHOUSE_GRPC_TARGET: warehouse:50051
    QUEUE_CONNECTION: sync
    MAIL_MAILER: log
    PHP_CLI_SERVER_WORKERS: 8
    PHP_OPCACHE_VALIDATE_TIMESTAMPS: 0
    PRODUCT_CACHE_ENABLED: ${PRODUCT_CACHE_ENABLED:-true}
    PRODUCT_CACHE_TTL: 300
    API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-60}
    CACHE_STORE: redis
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: 5672
    RABBITMQ_USER: ${RABBITMQ_USER:-ecommerce}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
    RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
  healthcheck:
    test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 20s
  depends_on:
    app-init:
      condition: service_completed_successfully
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    warehouse:
      condition: service_healthy


services:
  app-init:
    image: ecommerce-app
    container_name: ecommerce-app-init
    command: ["sh", "docker/entrypoint.sh", "init"]
    restart: "no"
    volumes:
      - .:/var/www/html
      - product-images:/var/www/html/storage/app/public
    environment: *app-environment
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      warehouse:
        condition: service_healthy

  app:
    <<: *app-instance
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-app
    hostname: app1
    volumes:
      - .:/var/www/html
      - product-images${PRODUCT_IMAGES_PER_INSTANCE:+-app1}:/var/www/html/storage/app/public

  app2:
    <<: *app-instance
    container_name: ecommerce-app2
    hostname: app2
    volumes:
      - .:/var/www/html
      - product-images${PRODUCT_IMAGES_PER_INSTANCE:+-app2}:/var/www/html/storage/app/public

  app3:
    <<: *app-instance
    container_name: ecommerce-app3
    hostname: app3
    volumes:
      - .:/var/www/html
      - product-images${PRODUCT_IMAGES_PER_INSTANCE:+-app3}:/var/www/html/storage/app/public

  nginx:
    image: nginx:1.28-alpine
    container_name: ecommerce-nginx
    ports:
      - "8000:80"
    environment:
      LB_METHOD: ${LB_METHOD:-least_conn}
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/lb:/etc/nginx/lb:ro
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      app2:
        condition: service_started
      app3:
        condition: service_started

  scheduler:
    image: ecommerce-app
    container_name: ecommerce-scheduler
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment: *app-environment
    depends_on:
      app-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    container_name: ecommerce-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: ecommerce-rabbitmq
    hostname: ecommerce-rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ecommerce}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  outbox-relay:
    image: ecommerce-app
    container_name: ecommerce-outbox-relay
    command: ["php", "artisan", "outbox:relay"]
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment: *app-environment
    depends_on:
      app-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker1: &worker
    image: ecommerce-app
    container_name: ecommerce-worker1
    hostname: worker1
    command: ["php", "artisan", "notifications:consume-order-created"]
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - .:/var/www/html
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-ecommerce}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: 0
      ORDER_WORKER_ACTION: ${ORDER_WORKER_ACTION:-db}   # db (default) | email
      ORDER_WORKER_DB_TASK_MS: ${ORDER_WORKER_DB_TASK_MS:-1000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: E-commerce
      DB_USERNAME: root
      DB_PASSWORD: ""
      CACHE_STORE: ${ORDER_EMAIL_WORKER_CACHE:-redis}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy

  worker2:
    <<: *worker
    container_name: ecommerce-worker2
    hostname: worker2

  worker3:
    <<: *worker
    container_name: ecommerce-worker3
    hostname: worker3

  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    command: ["--server-id=1", "--gtid-mode=ON", "--enforce-gtid-consistency=ON"]
    ports:
      - "3307:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: E-commerce
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql-replica:
    image: mysql:8.0
    container_name: ecommerce-mysql-replica
    profiles: ["replica"]
    command: ["--server-id=2", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--relay-log=relay-bin"]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql-replica-data:/var/lib/mysql
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  warehouse:
    build:
      context: ${WAREHOUSE_SERVICE_PATH:-../../warehouse-service}
    container_name: ecommerce-warehouse
    environment:
      WAREHOUSE_DB_HOST: warehouse-mysql
      WAREHOUSE_DB_PORT: 3306
      WAREHOUSE_DB_USER: warehouse
      WAREHOUSE_DB_PASSWORD: warehouse
      WAREHOUSE_DB_NAME: warehouse
    depends_on:
      warehouse-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.channel_ready_future(grpc.insecure_channel('127.0.0.1:50051')).result(timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  warehouse-mysql:
    image: mysql:8.0
    container_name: ecommerce-warehouse-mysql
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: warehouse
      MYSQL_USER: warehouse
      MYSQL_PASSWORD: warehouse
    volumes:
      - warehouse-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: ecommerce-phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOSTS: mysql,warehouse-mysql,mysql-replica
      PMA_ARBITRARY: 0
    volumes:
      - ./docker/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
    depends_on:
      - mysql
      - warehouse-mysql

volumes:
  product-images:
  product-images-app1:
  product-images-app2:
  product-images-app3:
  mysql-data:
  mysql-replica-data:
  warehouse-mysql-data:
  rabbitmq-data:
