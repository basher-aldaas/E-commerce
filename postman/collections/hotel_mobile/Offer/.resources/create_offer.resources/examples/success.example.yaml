$kind: http-example
request:
  url: "{{url}}/create_offer/1"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: title
        value: for night year
      - type: text
        key: description
        value: this happen has been taked for three dayes
      - type: text
        key: discount
        value: "50"
      - type: text
        key: start_date
        value: 2025-07-20
      - type: text
        key: end_date
        value: 2025-07-23
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: 127.0.0.1:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Sat, 19 Jul 2025 12:14:56 GMT
    Content-Type: application/json
    X-RateLimit-Limit: "60"
    X-RateLimit-Remaining: "58"
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "room_id": "1",
              "title": "for night year",
              "description": "this happen has been taked for three dayes",
              "discount": "50",
              "start_date": "2025-07-20",
              "end_date": "2025-07-23",
              "updated_at": "2025-07-19T12:14:56.000000Z",
              "created_at": "2025-07-19T12:14:56.000000Z",
              "id": 1
          },
          "message": "Created offer successfully"
      }
order: 3000
