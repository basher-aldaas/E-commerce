$kind: http-example
request:
  url: "{{url}}/show_room_bookings/1"
  method: GET
  headers:
    Accept: application/json
    Content-Type: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: 127.0.0.1:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Sat, 19 Jul 2025 15:27:46 GMT
    Content-Type: application/json
    X-RateLimit-Limit: "60"
    X-RateLimit-Remaining: "57"
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": [
              {
                  "start_date": "2025-07-20",
                  "end_date": "2025-10-22",
                  "final_price": 50
              }
          ],
          "message": "Getting all bookings successfully"
      }
order: 3000
