$kind: http-example
request:
  url: "{{url}}/create_booking/1"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: start_date
        value: 2025-07-18
      - type: text
        key: end_date
        value: 2025-10-18
      - type: text
        key: payment_status
        value: "1"
      - type: text
        key: guests_count
        value: "2"
response:
  statusCode: 402
  statusText: Payment Required
  headers:
    Host: 127.0.0.1:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Thu, 17 Jul 2025 12:50:03 GMT
    Content-Type: application/json
    X-RateLimit-Limit: "60"
    X-RateLimit-Remaining: "56"
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": [],
          "message": "You do not have enough money"
      }
order: 1000
