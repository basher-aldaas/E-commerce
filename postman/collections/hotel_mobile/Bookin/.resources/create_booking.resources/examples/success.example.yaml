$kind: http-example
request:
  url: "{{url}}/create_booking/2"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: start_date
        value: 2025-07-20
      - type: text
        key: end_date
        value: 2025-10-22
      - type: text
        key: payment_status
        value: "1"
      - type: text
        key: guests_count
        value: "4"
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: 127.0.0.1:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Sat, 19 Jul 2025 15:10:39 GMT
    Content-Type: application/json
    X-RateLimit-Limit: "60"
    X-RateLimit-Remaining: "59"
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "user_id": 1,
              "room_id": "2",
              "start_date": "2025-07-20",
              "end_date": "2025-10-22",
              "payment_status": 1,
              "guests_count": "4",
              "final_price": 25,
              "updated_at": "2025-07-19T15:10:39.000000Z",
              "created_at": "2025-07-19T15:10:39.000000Z",
              "id": 14
          },
          "message": "Booking created and payment deducted successfully"
      }
order: 2000
