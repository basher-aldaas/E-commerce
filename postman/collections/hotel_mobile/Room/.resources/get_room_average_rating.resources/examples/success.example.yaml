$kind: http-example
request:
  url: "{{url}}/get_room_average_rating/1"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: rating
        value: "4"
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: 127.0.0.1:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Thu, 17 Jul 2025 17:28:24 GMT
    Content-Type: application/json
    X-RateLimit-Limit: "60"
    X-RateLimit-Remaining: "59"
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "average_rating": 4
          },
          "message": "Average rating retrieved successfully."
      }
order: 1000
