$kind: http-example
request:
  url: "{{url}}/update_room"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content: []
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Host: 127.0.0.1:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Wed, 16 Jul 2025 13:37:36 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "message": "Unauthenticated."
      }
order: 2000
