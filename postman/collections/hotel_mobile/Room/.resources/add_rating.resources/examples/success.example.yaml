$kind: http-example
request:
  url: "{{url}}/add_rating/1"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: rating
        value: "4"
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: 127.0.0.1:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Thu, 17 Jul 2025 17:23:18 GMT
    Content-Type: application/json
    X-RateLimit-Limit: "60"
    X-RateLimit-Remaining: "58"
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "user_id": 1,
              "room_id": "1",
              "rating": "4",
              "comment": null,
              "updated_at": "2025-07-17T17:23:18.000000Z",
              "created_at": "2025-07-17T17:23:18.000000Z",
              "id": 1
          },
          "message": "Rating added successfully."
      }
order: 1000
