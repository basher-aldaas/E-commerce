$kind: http-example
request:
  url: "{{url}}/update_gallery/1"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: file
        key: image
        src:
          - /C:/Users/Lenovo/Desktop/hotel image/gallery3.jpg
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: 127.0.0.1:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Sat, 19 Jul 2025 11:25:42 GMT
    Content-Type: application/json
    X-RateLimit-Limit: "60"
    X-RateLimit-Remaining: "59"
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "id": 1,
              "image": "storage/galleries/20250719_112542_nPI42f.jpg",
              "created_at": "2025-07-19T11:22:38.000000Z",
              "updated_at": "2025-07-19T11:25:42.000000Z"
          },
          "message": "Gallery updated successfully"
      }
order: 1000
