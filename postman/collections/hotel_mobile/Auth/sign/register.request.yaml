$kind: http-request
url: "{{url}}/register"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: name
      value: bashir aldaas
    - type: text
      key: email
      value: bashir@gmail.com
    - type: text
      key: phone
      value: "0994875925"
    - type: text
      key: password
      value: "11111111"
    - type: text
      key: password_confirmation
      value: "11111111"
    - type: file
      key: image
      src: []
examples: ./.resources/register.resources/examples
order: 1000
