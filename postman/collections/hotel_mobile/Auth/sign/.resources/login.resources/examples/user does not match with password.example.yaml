$kind: http-example
request:
  url: "{{url}}/login"
  method: POST
  headers:
    Accept: application/json
    content-type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: email
        value: bashir@gmail.com
      - type: text
        key: password
        value: "1111111"
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: 127.0.0.1:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Tue, 15 Jul 2025 13:28:17 GMT
    Content-Type: application/json
    X-RateLimit-Limit: "60"
    X-RateLimit-Remaining: "59"
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": [],
          "message": "User email does not match with password"
      }
order: 3000
