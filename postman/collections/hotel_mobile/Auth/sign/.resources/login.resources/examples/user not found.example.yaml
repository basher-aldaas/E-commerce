$kind: http-example
request:
  url: "{{url}}/login"
  method: POST
  headers:
    Accept: application/json
    content-type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: email
        value: bashir1@gmail.com
      - type: text
        key: password
        value: "11111111"
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    Host: 127.0.0.1:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Tue, 15 Jul 2025 13:23:06 GMT
    Content-Type: application/json
    X-RateLimit-Limit: "60"
    X-RateLimit-Remaining: "58"
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 0,
          "data": [],
          "message": {
              "email": [
                  "The selected email is invalid."
              ]
          }
      }
order: 2000
