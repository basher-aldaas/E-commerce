$kind: http-request
url: "{{url}}/api/auth/register"
method: POST
headers:
  Accept: application/json
body:
  type: formdata
  content:
    - type: text
      key: userName
      value: basher
    - type: text
      key: email
      value: raghad@gmail.com
    - type: text
      key: phoneNumber
      value: "0968438721"
    - type: text
      key: password
      value: raghad
    - type: text
      key: password_confirmation
      value: raghad
    - type: text
      key: role
      value: "1"
examples: ./.resources/register.resources/examples
order: 1000
