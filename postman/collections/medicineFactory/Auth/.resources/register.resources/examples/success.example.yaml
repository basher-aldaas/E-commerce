    type: formdata
    content:
      - type: text
        key: userName
        value: basher
      - type: text
        key: email
        value: basher12aldaas@gmail.com
      - type: text
        key: phoneNumber
        value: "0996854784"
      - type: text
        key: password
        value: 5748489k
      - type: text
        key: password_confirmation
        value: 5748489k
