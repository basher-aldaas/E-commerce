$kind: http-example
request:
  url: "{{url}}/api/addToCart"
  method: POST
  headers:
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: fMedicine_id
        value: "1"
      - type: text
        key: quantity
        value: "92"
      - type: text
        key: order_id
        value: "1"
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Host
      value: 127.0.0.1:8000
    - key: Date
      value: Fri, 15 Dec 2023 18:24:43 GMT
    - key: Date
      value: Fri, 15 Dec 2023 18:24:43 GMT
    - key: Connection
      value: close
    - key: X-Powered-By
      value: PHP/8.2.10
    - key: Cache-Control
      value: no-cache, private
    - key: Content-Type
      value: application/json
    - key: X-RateLimit-Limit
      value: "60"
    - key: X-RateLimit-Remaining
      value: "57"
    - key: Access-Control-Allow-Origin
      value: "*"
  body:
    type: json
    content: |-
      {
          "status": 0,
          "message": "you should order asmaller quantity"
      }
order: 3000
