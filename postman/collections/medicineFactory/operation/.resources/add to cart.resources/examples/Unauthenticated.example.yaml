$kind: http-example
request:
  url: "{{url}}/api/addToCart"
  method: POST
  headers:
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: fMedicine_id
        value: "2"
      - type: text
        key: order_id
        value: "1"
      - type: text
        key: medicineName
        value: Morphine
      - type: text
        key: quantity
        value: "3"
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: Host
      value: 127.0.0.1:8000
    - key: Date
      value: Fri, 15 Dec 2023 13:15:43 GMT
    - key: Date
      value: Fri, 15 Dec 2023 13:15:43 GMT
    - key: Connection
      value: close
    - key: X-Powered-By
      value: PHP/8.2.10
    - key: Cache-Control
      value: no-cache, private
    - key: Content-Type
      value: application/json
    - key: Access-Control-Allow-Origin
      value: "*"
  body:
    type: json
    content: |-
      {
          "message": "Unauthenticated."
      }
order: 1000
