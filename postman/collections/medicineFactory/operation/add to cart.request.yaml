$kind: http-request
url: "{{url}}/api/addToCart"
method: POST
headers:
  Accept: application/json
body:
  type: formdata
  content:
    - type: text
      key: fMedicine_id
      value: "3"
    - type: text
      key: quantity
      value: "90"
    - type: text
      key: order_id
      value: "1"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
examples: ./.resources/add to cart.resources/examples
order: 7000
