$kind: http-example
request:
  url: "{{url}}/api/factory-medicines"
  method: POST
  headers:
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: factory_id
        value: "4"
      - type: text
        key: catigorie_id
        value: "1"
      - type: text
        key: medicine_id
        value: "2"
      - type: text
        key: scientific_name
        value: Ibuprofen
      - type: text
        key: commercial_name
        value: Ibuprofen
      - type: text
        key: catigorie
        value: Analgesics
      - type: text
        key: man_company
        value: tameco
      - type: text
        key: amount
        value: "30"
      - type: text
        key: exp_day
        value: 2020-8-5
      - type: text
        key: price
        value: "3000"
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Host
      value: 127.0.0.1:8000
    - key: Date
      value: Mon, 25 Dec 2023 15:55:16 GMT
    - key: Date
      value: Mon, 25 Dec 2023 15:55:16 GMT
    - key: Connection
      value: close
    - key: X-Powered-By
      value: PHP/8.2.10
    - key: Cache-Control
      value: no-cache, private
    - key: Content-Type
      value: application/json
    - key: X-RateLimit-Limit
      value: "60"
    - key: X-RateLimit-Remaining
      value: "57"
    - key: Access-Control-Allow-Origin
      value: "*"
  body:
    type: json
    content: |-
      {
          "message": "Medicine added successfully",
          "medicine": {
              "factory_id": "4",
              "catigorie_id": "1",
              "medicine_id": "2",
              "scientific_name": "Ibuprofen",
              "commercial_name": "Ibuprofen",
              "catigorie": "Analgesics",
              "man_company": "tameco",
              "amount": "30",
              "exp_day": "2020-8-5",
              "price": "3000",
              "updated_at": "2023-12-25T15:55:16.000000Z",
              "created_at": "2023-12-25T15:55:16.000000Z",
              "id": 4
          }
      }
order: 2000
