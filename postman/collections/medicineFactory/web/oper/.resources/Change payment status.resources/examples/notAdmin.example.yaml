$kind: http-example
request:
  url: "{{url}}/api/PaymentStatus"
  method: POST
  headers:
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: order_id
        value: "1"
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Host
      value: 127.0.0.1:8000
    - key: Date
      value: Tue, 02 Jan 2024 19:46:17 GMT
    - key: Date
      value: Tue, 02 Jan 2024 19:46:17 GMT
    - key: Connection
      value: close
    - key: X-Powered-By
      value: PHP/8.2.10
    - key: Cache-Control
      value: no-cache, private
    - key: Content-Type
      value: application/json
    - key: X-RateLimit-Limit
      value: "60"
    - key: X-RateLimit-Remaining
      value: "59"
    - key: Access-Control-Allow-Origin
      value: "*"
  body:
    type: json
    content: |-
      {
          "status": 0,
          "message": "You don't have an admin access"
      }
order: 1000
