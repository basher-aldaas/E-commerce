$kind: http-request
url: "{{url}}/api/PaymentStatus"
method: POST
headers:
  Accept: application/json
body:
  type: formdata
  content:
    - type: text
      key: order_id
      value: "2"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
examples: ./.resources/Change payment status.resources/examples
order: 7000
