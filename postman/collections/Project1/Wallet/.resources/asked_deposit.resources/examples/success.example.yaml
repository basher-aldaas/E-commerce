$kind: http-example
request:
  url: "{{url}}/wallet/asked_deposit"
  method: POST
  headers:
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: amount
        value: "200"
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Host
      value: localhost:8000
    - key: Date
      value: Sat, 29 Jun 2024 13:07:46 GMT
    - key: Date
      value: Sat, 29 Jun 2024 13:07:46 GMT
    - key: Connection
      value: close
    - key: X-Powered-By
      value: PHP/8.2.10
    - key: Cache-Control
      value: no-cache, private
    - key: Content-Type
      value: application/json
    - key: X-RateLimit-Limit
      value: "60"
    - key: X-RateLimit-Remaining
      value: "59"
    - key: Access-Control-Allow-Origin
      value: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": 1250,
          "message": "sending message successfully"
      }
order: 2000
