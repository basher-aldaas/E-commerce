$kind: http-example
request:
  url: "{{url}}/wallet/withdraw"
  method: POST
  headers:
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: amount
        value: "2000"
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: Host
      value: localhost:8000
    - key: Date
      value: Sat, 29 Jun 2024 14:11:40 GMT
    - key: Date
      value: Sat, 29 Jun 2024 14:11:40 GMT
    - key: Connection
      value: close
    - key: X-Powered-By
      value: PHP/8.2.10
    - key: Cache-Control
      value: no-cache, private
    - key: Content-Type
      value: application/json
    - key: X-RateLimit-Limit
      value: "60"
    - key: X-RateLimit-Remaining
      value: "59"
    - key: Access-Control-Allow-Origin
      value: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": [],
          "message": "you can not withdraw money more than you have"
      }
order: 4000
