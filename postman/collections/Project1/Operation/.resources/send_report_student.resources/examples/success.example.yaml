$kind: http-example
request:
  url: "{{url}}/send_report_student/15"
  method: POST
  headers:
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: reason
        value: he said bad words
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Host
      value: localhost:8000
    - key: Date
      value: Sat, 29 Jun 2024 17:07:22 GMT
    - key: Date
      value: Sat, 29 Jun 2024 17:07:22 GMT
    - key: Connection
      value: close
    - key: X-Powered-By
      value: PHP/8.2.10
    - key: Cache-Control
      value: no-cache, private
    - key: Content-Type
      value: application/json
    - key: X-RateLimit-Limit
      value: "60"
    - key: X-RateLimit-Remaining
      value: "58"
    - key: Access-Control-Allow-Origin
      value: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "user_id": 1,
              "student_id": "15",
              "reason": "he said bad words"
          },
          "message": "Sending report successfully"
      }
order: 2000
