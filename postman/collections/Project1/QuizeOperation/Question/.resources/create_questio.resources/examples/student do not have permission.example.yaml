$kind: http-example
request:
  url: "{{url}}/create_question/8"
  method: POST
  headers:
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: question
        value: do you like laravel
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    - key: Host
      value: localhost:8000
    - key: Date
      value: Wed, 29 May 2024 15:07:49 GMT
    - key: Date
      value: Wed, 29 May 2024 15:07:49 GMT
    - key: Connection
      value: close
    - key: X-Powered-By
      value: PHP/8.2.10
    - key: Cache-Control
      value: no-cache, private
    - key: Content-Type
      value: application/json
    - key: X-RateLimit-Limit
      value: "60"
    - key: X-RateLimit-Remaining
      value: "59"
    - key: Access-Control-Allow-Origin
      value: "*"
  body:
    type: json
    content: |-
      {
          "status": 0,
          "data": "",
          "message": "You do not have the required authorization"
      }
order: 2000
