$kind: http-example
request:
  url: "{{url}}/create_question/61"
  method: POST
  headers:
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: question
        value: do you like laravel
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Host
      value: localhost:8000
    - key: Date
      value: Wed, 29 May 2024 15:14:12 GMT
    - key: Date
      value: Wed, 29 May 2024 15:14:12 GMT
    - key: Connection
      value: close
    - key: X-Powered-By
      value: PHP/8.2.10
    - key: Cache-Control
      value: no-cache, private
    - key: Content-Type
      value: application/json
    - key: X-RateLimit-Limit
      value: "60"
    - key: X-RateLimit-Remaining
      value: "58"
    - key: Access-Control-Allow-Origin
      value: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "quiz_id": "61",
              "question": "do you like laravel",
              "updated_at": "2024-05-29T15:14:12.000000Z",
              "created_at": "2024-05-29T15:14:12.000000Z",
              "id": 27
          },
          "message": "Adding question successfully"
      }
order: 5000
