$kind: http-example
request:
  url: "{{url}}/submit_quiz/10"
  method: POST
  headers:
    Accept: application/json
  body:
    type: json
    content: "{\r

      \    \"answers\": [364, 368, 372, 2, 5, 1, 2, 3, 4, 5]\r

      }\r\n"
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Host
      value: localhost:8000
    - key: Date
      value: Mon, 01 Jul 2024 13:02:12 GMT
    - key: Date
      value: Mon, 01 Jul 2024 13:02:12 GMT
    - key: Connection
      value: close
    - key: X-Powered-By
      value: PHP/8.2.10
    - key: Cache-Control
      value: no-cache, private
    - key: Content-Type
      value: application/json
    - key: X-RateLimit-Limit
      value: "60"
    - key: X-RateLimit-Remaining
      value: "58"
    - key: Access-Control-Allow-Origin
      value: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "mark": "3 From 10",
              "answers": [
                  364,
                  368,
                  372,
                  2,
                  5,
                  1,
                  2,
                  3,
                  4,
                  5
              ]
          },
          "message": "Your mark"
      }
order: 5000
