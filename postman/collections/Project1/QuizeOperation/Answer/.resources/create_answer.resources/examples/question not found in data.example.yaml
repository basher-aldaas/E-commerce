$kind: http-example
request:
  url: "{{url}}/create_answer/80"
  method: POST
  headers:
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: choice
        value: bb
response:
  statusCode: 404
  statusText: Not Found
  headers:
    - key: Host
      value: localhost:8000
    - key: Date
      value: Wed, 29 May 2024 16:54:13 GMT
    - key: Date
      value: Wed, 29 May 2024 16:54:13 GMT
    - key: Connection
      value: close
    - key: X-Powered-By
      value: PHP/8.2.10
    - key: Cache-Control
      value: no-cache, private
    - key: Content-Type
      value: application/json
    - key: X-RateLimit-Limit
      value: "60"
    - key: X-RateLimit-Remaining
      value: "57"
    - key: Access-Control-Allow-Origin
      value: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": [],
          "message": "This question not found"
      }
order: 3000
