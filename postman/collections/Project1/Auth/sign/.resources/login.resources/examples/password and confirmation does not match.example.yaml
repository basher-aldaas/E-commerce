$kind: http-example
request:
  url: "{{url}}/login"
  method: POST
  headers:
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: email
        value: s1@example.com
      - type: text
        key: password
        value: "57484899"
      - type: text
        key: password_confirmation
        value: "5748489"
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    - key: Host
      value: localhost:8000
    - key: Date
      value: Mon, 27 May 2024 09:58:53 GMT
    - key: Date
      value: Mon, 27 May 2024 09:58:53 GMT
    - key: Connection
      value: close
    - key: X-Powered-By
      value: PHP/8.2.10
    - key: Cache-Control
      value: no-cache, private
    - key: Content-Type
      value: application/json
    - key: X-RateLimit-Limit
      value: "60"
    - key: X-RateLimit-Remaining
      value: "58"
    - key: Access-Control-Allow-Origin
      value: "*"
  body:
    type: json
    content: |-
      {
          "status": 0,
          "data": [],
          "message": {
              "password": [
                  "The password field confirmation does not match."
              ]
          }
      }
order: 8000
