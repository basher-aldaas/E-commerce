$kind: http-example
request:
  url: "{{url}}/user_check_code"
  method: POST
  headers:
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: code
        value: "768619"
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Host
      value: localhost:8000
    - key: Date
      value: Sun, 26 May 2024 22:53:18 GMT
    - key: Date
      value: Sun, 26 May 2024 22:53:18 GMT
    - key: Connection
      value: close
    - key: X-Powered-By
      value: PHP/8.2.10
    - key: Cache-Control
      value: no-cache, private
    - key: Content-Type
      value: application/json
    - key: X-RateLimit-Limit
      value: "60"
    - key: X-RateLimit-Remaining
      value: "55"
    - key: Access-Control-Allow-Origin
      value: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": "768619",
          "message": "The code is correct"
      }
order: 1000
