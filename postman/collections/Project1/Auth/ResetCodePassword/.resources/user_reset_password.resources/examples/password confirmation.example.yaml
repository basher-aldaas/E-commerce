$kind: http-example
request:
  url: "{{url}}/user_reset_password"
  method: POST
  headers:
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: code
        value: "573912"
      - type: text
        key: password
        value: "57484899"
      - type: text
        key: password_confirmation
        value: "57484899"
        disabled: true
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    - key: Host
      value: localhost:8000
    - key: Date
      value: Mon, 27 May 2024 10:42:33 GMT
    - key: Date
      value: Mon, 27 May 2024 10:42:33 GMT
    - key: Connection
      value: close
    - key: X-Powered-By
      value: PHP/8.2.10
    - key: Cache-Control
      value: no-cache, private
    - key: Content-Type
      value: application/json
    - key: X-RateLimit-Limit
      value: "60"
    - key: X-RateLimit-Remaining
      value: "57"
    - key: Access-Control-Allow-Origin
      value: "*"
  body:
    type: json
    content: |-
      {
          "message": "The selected code is invalid. (and 1 more error)",
          "errors": {
              "code": [
                  "The selected code is invalid."
              ],
              "password": [
                  "The password field confirmation does not match."
              ]
          }
      }
order: 5000
