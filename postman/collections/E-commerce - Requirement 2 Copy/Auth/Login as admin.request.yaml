$kind: http-request
url: "{{base_url}}/api/v1/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{admin_email}}",
        "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));

      const d = pm.response.json().data;
      pm.test("Returns a Bearer token", () => pm.expect(d.access_token).to.be.a("string"));
      pm.collectionVariables.set("admin_token", d.access_token);
    language: text/javascript
order: 1000
