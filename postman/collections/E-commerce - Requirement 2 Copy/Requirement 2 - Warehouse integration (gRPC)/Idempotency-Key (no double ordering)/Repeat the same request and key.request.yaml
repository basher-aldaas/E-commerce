$kind: http-request
url: "{{base_url}}/api/v1/orders"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Idempotency-Key: "{{idempotency_key}}"
body:
  type: json
  content: |-
    {
        "items": [
            { "product_id": 86, "quantity": 1 }
        ]
    }
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 or 201", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      pm.test("Returns the same order", () => pm.expect(pm.response.json().data.id).to.eql(Number(pm.collectionVariables.get("order3_id"))));
    language: text/javascript
order: 2000
