$kind: http-request
url: "{{base_url}}/api/v1/orders"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Idempotency-Key: "{{idempotency_key}}"
body:
  type: json
  content: |-
    {
        "items": [
            { "product_id": 86, "quantity": 1 }
        ]
    }
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("idempotency_key", pm.variables.replaceIn("{{$guid}}"));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));

      pm.collectionVariables.set("order3_id", pm.response.json().data.id);
      pm.collectionVariables.set("expected_stock", Number(pm.collectionVariables.get("expected_stock")) - 1);
    language: text/javascript
order: 1000
