$kind: http-request
url: "{{base_url}}/api/v1/auth/logout"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
