$kind: http-request
url: "{{base_url}}/api/v1/inventory/999999999"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "stock": 1
    }
auth:
  type: bearer
  credentials:
    token: "{{admin_token}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 404", () => pm.response.to.have.status(404));
    language: text/javascript
order: 7000
