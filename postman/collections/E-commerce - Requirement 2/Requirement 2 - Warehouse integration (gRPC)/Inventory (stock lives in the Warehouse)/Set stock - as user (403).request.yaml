$kind: http-request
url: "{{base_url}}/api/v1/inventory/85"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "stock": 1000
    }
auth:
  type: bearer
  credentials:
    token: "{{user_token}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 403", () => pm.response.to.have.status(403));
    language: text/javascript
examples: .resources/Set stock - as user (403).resources/examples
order: 5000
