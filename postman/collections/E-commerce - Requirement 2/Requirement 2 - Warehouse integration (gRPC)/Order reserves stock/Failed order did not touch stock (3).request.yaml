$kind: http-request
url: "{{base_url}}/api/v1/products/{{product_id}}"
method: GET
headers:
  Accept: application/json
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{admin_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const p = pm.response.json().data;
      pm.test("Stock is " + pm.collectionVariables.get("expected_stock"), () => pm.expect(p.stock).to.eql(Number(pm.collectionVariables.get("expected_stock"))));
    language: text/javascript
order: 4000
