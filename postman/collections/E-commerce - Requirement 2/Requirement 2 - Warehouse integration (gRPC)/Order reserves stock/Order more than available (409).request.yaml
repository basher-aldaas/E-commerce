$kind: http-request
url: "{{base_url}}/api/v1/orders"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "items": [
            { "product_id": 85, "quantity": 1000 }
        ]
    }
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409", () => pm.response.to.have.status(409));
      pm.test("Insufficient stock message", () => pm.expect(pm.response.json().message.toLowerCase()).to.include("stock"));
    language: text/javascript
examples: .resources/Order more than available (409).resources/examples
order: 3000
