$kind: http-request
url: "{{base_url}}/api/v1/orders/{{order2_id}}/status"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "status": "confirmed"
    }
auth:
  type: bearer
  credentials:
    token: "{{admin_token}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 409", () => pm.response.to.have.status(409));
    language: text/javascript
examples: .resources/Reopen a cancelled order (409).resources/examples
order: 5000
