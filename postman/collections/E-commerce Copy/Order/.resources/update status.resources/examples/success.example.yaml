$kind: http-example
request:
  url: http://localhost:8000/api/v1/orders/2/status
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: status
        value: confirmed
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Mon, 02 Nov 2026 22:06:04 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "id": 2,
              "user_id": 2,
              "status": "confirmed",
              "total_amount": "700.00",
              "created_at": "2026-11-02T21:51:56.000000Z",
              "updated_at": "2026-11-02T22:06:04.000000Z"
          },
          "message": "Order status updated successfully",
          "status_code": 200,
          "timestamp": "2026-11-02T22:06:04+00:00"
      }
order: 3000
