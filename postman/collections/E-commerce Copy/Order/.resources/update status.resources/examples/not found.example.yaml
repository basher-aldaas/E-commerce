$kind: http-example
request:
  url: http://localhost:8000/api/v1/orders/1/status
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: status
        value: confirmed
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Mon, 02 Nov 2026 22:05:18 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 0,
          "data": [],
          "message": "The requested order was not found.",
          "status_code": 404,
          "timestamp": "2026-11-02T22:05:18+00:00"
      }
order: 2000
