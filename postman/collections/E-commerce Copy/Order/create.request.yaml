$kind: http-request
url: http://localhost:8000/api/v1/orders
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: items[0][product_id]
      value: "1"
    - type: text
      key: items[0][quantity]
      value: "2"
    - type: text
      key: items[1][product_id]
      value: "2"
    - type: text
      key: items[1][quantity]
      value: "2"
auth:
  type: bearer
  credentials:
    token: "{{user}}"
examples: ./.resources/create.resources/examples
order: 4000
