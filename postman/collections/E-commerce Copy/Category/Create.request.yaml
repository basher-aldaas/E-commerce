$kind: http-request
url: http://localhost:8000/api/v1/categories
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: name
      value: clothes
    - type: text
      key: descreiption
      value: ""
      disabled: true
auth:
  type: bearer
  credentials:
    token: "{{admin}}"
examples: ./.resources/Create.resources/examples
order: 1000
