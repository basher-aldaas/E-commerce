$kind: http-example
request:
  url: http://localhost:8000/api/v1/products
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: name
        value: bob
      - type: text
        key: price
        value: "50"
      - type: text
        key: category_id
        value: "1"
      - type: text
        key: stock
        value: "20"
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Mon, 02 Nov 2026 21:38:15 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 0,
          "data": [],
          "message": "This action is unauthorized.",
          "status_code": 403,
          "timestamp": "2026-11-02T21:38:15+00:00"
      }
order: 1000
