$kind: http-request
url: http://localhost:8000/api/v2/products?category_id=3&min_price=10&in_stock=1
method: GET
headers:
  Accept: application/json
  Content-Type: application/json
queryParams:
  category_id: "3"
  min_price: "10"
  in_stock: "1"
body:
  type: formdata
  content:
    - type: text
      key: category_id
      value: "1"
auth:
  type: bearer
  credentials:
    token: "{{bashir}}"
settings: {}
examples: ./.resources/index v2.resources/examples
order: 4000
