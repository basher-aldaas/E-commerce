$kind: http-request
url: http://localhost:8000/api/v1/auth/register
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: name
      value: bashir
    - type: text
      key: email
      value: bashir@system.com
    - type: text
      key: password
      value: pasword123
    - type: text
      key: password_confirmation
      value: pasword123
examples: ./.resources/Register.resources/examples
order: 1000
