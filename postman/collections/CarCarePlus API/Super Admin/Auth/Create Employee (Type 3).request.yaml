$kind: http-request
description: "Super admin creates an employee. `type` is one of: washer, mechanic."
url: "{{base_url}}/api/admin/employees"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "name": "Basir Employee",
        "email": "employee3@example.com",
        "phone": "0504000003",
        "password": "password123",
        "branch_id": 1,
        "type": "admin"
    }
auth:
  type: bearer
  credentials:
    token: "{{super-token}}"
order: 1000
