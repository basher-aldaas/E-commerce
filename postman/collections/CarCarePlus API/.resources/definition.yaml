    secret: false
  - key: washer-token
    value: ""
    disabled: false
    secret: false
  - key: mechanic-token
    value: ""
    disabled: false
    secret: false
  - key: workshop
    value: ""
    disabled: false
    secret: false
  - key: token
    value: ""
    disabled: false
    secret: false
  - key: auth_secret_14hx
    secret: true
    disabled: false
  - key: auth_secret_08vu
    secret: true
