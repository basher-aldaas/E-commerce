$kind: collection
description: |-
  Auth, registration and super-admin approval endpoints for CarCarePlus.

  Set the `base_url` variable (default http://localhost:8000). The Login / Register Customer requests automatically save the returned Sanctum token into the `token` collection variable, which every authenticated request uses as a Bearer token.
variables:
  - key: base_url
    value: http://localhost:8000
    disabled: false
    secret: false
  - key: super-token
    value: ""
    disabled: false
    secret: false
  - key: admin
    value: ""
    disabled: false
    secret: false
  - key: customer1-token
    value: ""
    disabled: false
    secret: false
  - key: customer2-token
    value: ""
    disabled: false
    secret: false
  - key: company1-token
    value: ""
