$kind: http-request
description: Email a one-time reset code. Responds generically to prevent account enumeration.
url: "{{base_url}}/api/auth/password/otp/send"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "email": "superadmin@system.com"
    }
order: 3000
