$kind: http-request
description: Send a password reset link by email. Always responds generically to prevent account enumeration.
url: "{{base_url}}/api/auth/forgot-password"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "email": "superadmin@system.com"
    }
order: 1000
