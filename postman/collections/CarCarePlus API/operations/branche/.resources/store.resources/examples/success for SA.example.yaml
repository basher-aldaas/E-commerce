$kind: http-example
request:
  url: "{{base_url}}/api/branches"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: admin_id
        value: "2"
      - type: text
        key: name
        value: Doumas
      - type: text
        key: name_ar
        value: دوماز
      - type: text
        key: city
        value: Douma
      - type: text
        key: address
        value: khorshid street
      - type: text
        key: latitude
        value: "33"
      - type: text
        key: longitude
        value: "33"
      - type: text
        key: phone
        value: "0999999999"
      - type: text
        key: working_hours
        value: ""
        disabled: true
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Thu, 30 Jul 2026 16:50:25 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "id": 6,
              "admin_id": 2,
              "name": "Doumas",
              "name_ar": "دوماز",
              "city": "Douma",
              "address": "khorshid street",
              "latitude": 33,
              "longitude": 33,
              "phone": "0999999999",
              "is_active": null,
              "working_hours": null,
              "is_24h": null
          },
          "message": "branch created successfully",
          "status_code": 200,
          "timestamp": "2026-07-30T16:50:25+00:00"
      }
order: 1000
