$kind: http-request
url: "{{base_url}}/api/branches"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: admin_id
      value: "2"
    - type: text
      key: name
      value: Doumas
    - type: text
      key: name_ar
      value: دوماز
    - type: text
      key: city
      value: Douma
    - type: text
      key: address
      value: khorshid street
    - type: text
      key: latitude
      value: "33"
    - type: text
      key: longitude
      value: "33"
    - type: text
      key: phone
      value: "0999999999"
    - type: text
      key: working_hours
      value: ""
      disabled: true
auth:
  type: bearer
  credentials:
    token: "{{super-token}}"
examples: ./.resources/store.resources/examples
order: 3000
