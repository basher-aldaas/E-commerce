$kind: http-example
request:
  url: "{{base_url}}/api/bookings/quote"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content: []
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Tue, 11 Aug 2026 19:28:24 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "message": "Your account is inactive."
      }
order: 2000
