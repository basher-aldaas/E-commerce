$kind: http-example
request:
  url: "{{base_url}}/api/bookings/quote"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: car_ids[0]
        value: "2"
      - type: text
        key: service_id
        value: "1"
      - type: text
        key: booking_type
        value: "1"
      - type: text
        key: payment_method
        value: cash
      - type: text
        key: scheduled_at
        value: 1-2-2027
        disabled: true
      - type: text
        key: car_ids[1]
        value: "1"
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Sat, 08 Aug 2026 19:14:55 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 0,
          "data": {
              "car_ids": [
                  "Personal customers may only book one car at a time."
              ]
          },
          "message": "Personal customers may only book one car at a time.",
          "status_code": 422,
          "timestamp": "2026-08-08T19:14:55+00:00"
      }
order: 5000
