$kind: http-example
name: location_lat and location_lng are required or location_address and branch_id
request:
  url: "{{base_url}}/api/bookings/quote"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: car_ids[0]
        value: "10"
      - type: text
        key: service_id
        value: "1"
      - type: text
        key: booking_type
        value: "0"
      - type: text
        key: payment_method
        value: cash
      - type: text
        key: scheduled_at
        value: 20-10-2026
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Tue, 11 Aug 2026 20:43:09 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 0,
          "data": {
              "location_lat": [
                  "The location lat field is required when branch id is not present."
              ],
              "location_lng": [
                  "The location lng field is required when branch id is not present."
              ],
              "branch_id": [
                  "The branch id field is required when location lat is not present."
              ],
              "location_address": [
                  "The location address field is required when location lat is not present."
              ]
          },
          "message": "The location lat field is required when branch id is not present. (and 3 more errors)",
          "status_code": 422,
          "timestamp": "2026-08-11T23:43:09+03:00"
      }
order: 9000
