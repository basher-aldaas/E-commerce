  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \    \"pricing_rule_type_id\": 1,\r

    \    \"name\": \"Tank Extra Charge\",\r

    \    \"name_ar\": \"زيادة سعر سيارات Tank\",\r

    \    \"value\": 20,\r

    \    \"conditions\": {\r

    \        \"vehicle_type\": \"Tank\"\r

    \    },\r

    \    \"is_active\": true\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{super-token}}"
examples: ./.resources/store.resources/examples
order: 3000
