$kind: http-example
request:
  url: "{{base_url}}/api/pricing-rules"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: "{\r

      \    \"pricing_rule_type_id\": 1,\r

      \    \"name\": \"Tank Extra Charge\",\r

      \    \"name_ar\": \"زيادة سعر سيارات Tank\",\r

      \    \"value\": 20,\r

      \    \"conditions\": {\r

      \        \"vehicle_type\": \"Tank\"\r

      \    },\r

      \    \"is_active\": true\r

      }"
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Thu, 30 Jul 2026 10:01:12 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "id": 15,
              "pricing_rule_type_id": 1,
              "name": "Tank Extra Charge",
              "name_ar": "زيادة سعر سيارات Tank",
              "value": 20,
              "conditions": {
                  "vehicle_type": "Tank"
              },
              "is_active": true
          },
          "message": "pricing rule created successfully",
          "status_code": 200,
          "timestamp": "2026-07-30T10:01:12+00:00"
      }
order: 2000
