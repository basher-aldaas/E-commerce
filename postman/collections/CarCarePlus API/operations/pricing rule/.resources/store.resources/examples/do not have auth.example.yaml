$kind: http-example
request:
  url: "{{base_url}}/api/pricing-rules"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: pricing_rule_type_id
        value: "1"
      - type: text
        key: name
        value: Tank Extra Pice
      - type: text
        key: name_ar
        value: زيادة سعر غسيل الشاحنات
      - type: text
        key: value
        value: "20"
      - type: text
        key: conditions
        value: '{"vehicle_type":"Tank"}'
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Thu, 30 Jul 2026 09:57:57 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 0,
          "data": "",
          "message": "strings.You do not have the required authorization",
          "status_code": 403,
          "timestamp": "2026-07-30T09:57:57+00:00"
      }
order: 1000
