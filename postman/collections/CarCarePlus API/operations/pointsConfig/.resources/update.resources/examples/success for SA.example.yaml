$kind: http-example
request:
  url: "{{base_url}}/api/points-configs/1"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: redeem_value
        value: "0.3"
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Wed, 22 Jul 2026 01:38:15 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "id": 1,
              "earn_per_amount": "10.00",
              "redeem_value": "0.30",
              "min_redeem": 100,
              "expiry_days": 365,
              "max_earn_per_order": 50,
              "is_active": true,
              "updated_at": "2026-07-22 04:37:56"
          },
          "message": "Points config updated successfully",
          "status_code": 200,
          "timestamp": "2026-07-22T01:38:15+00:00"
      }
order: 1000
