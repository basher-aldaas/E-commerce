$kind: http-request
url: "{{base_url}}/api/points-configs/1"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: redeem_value
      value: "0.3"
auth:
  type: bearer
  credentials:
    token: "{{super-token}}"
examples: ./.resources/update.resources/examples
order: 3000
