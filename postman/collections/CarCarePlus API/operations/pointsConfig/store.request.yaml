$kind: http-request
url: "{{base_url}}/api/points-configs"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: earn_per_amount
      value: "8"
    - type: text
      key: redeem_value
      value: "0.2"
    - type: text
      key: min_redeem
      value: "90"
    - type: text
      key: expiry_days
      value: "300"
    - type: text
      key: max_earn_per_order
      value: "50"
    - type: text
      key: is_active
      value: "1"
auth:
  type: bearer
  credentials:
    token: "{{super-token}}"
examples: ./.resources/store.resources/examples
order: 4000
