$kind: http-request
url: "{{base_url}}/api/materials"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: material_unit_id
      value: "1"
    - type: text
      key: name
      value: feule
    - type: text
      key: name_ar
      value: وقود
    - type: text
      key: unit_price
      value: "20"
    - type: text
      key: is_active
      value: "1"
      disabled: true
    - type: text
      key: description
      value: ttt
      disabled: true
    - type: text
      key: is_visible_to_customer
      value: "0"
      disabled: true
auth:
  type: bearer
  credentials:
    token: "{{super-token}}"
examples: ./.resources/store.resources/examples
order: 3000
