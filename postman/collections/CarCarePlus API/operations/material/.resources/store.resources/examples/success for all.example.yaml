$kind: http-example
request:
  url: "{{base_url}}/api/materials"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: material_unit_id
        value: "1"
      - type: text
        key: name
        value: feule
      - type: text
        key: name_ar
        value: وقود
      - type: text
        key: unit_price
        value: "20"
      - type: text
        key: is_active
        value: "1"
        disabled: true
      - type: text
        key: description
        value: ttt
        disabled: true
      - type: text
        key: is_visible_to_customer
        value: "0"
        disabled: true
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Fri, 07 Aug 2026 13:01:52 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "id": 4,
              "material_unit_id": 1,
              "name": "feule",
              "name_ar": "وقود",
              "description": null,
              "unit_price": "20.00",
              "is_visible_to_customer": null,
              "is_active": null
          },
          "message": "material created successfully",
          "status_code": 200,
          "timestamp": "2026-08-07T13:01:52+00:00"
      }
order: 1000
