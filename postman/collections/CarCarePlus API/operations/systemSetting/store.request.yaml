$kind: http-request
url: "{{base_url}}/api/system-settings"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: key
      value: tax
    - type: text
      key: value
      value: "15"
    - type: text
      key: type
      value: number
    - type: text
      key: description
      value: نسبة  الضريبة المطبقة على الخدمات
auth:
  type: bearer
  credentials:
    token: "{{super-token}}"
examples: ./.resources/store.resources/examples
order: 3000
