$kind: http-example
request:
  url: "{{base_url}}/api/system-settings"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: key
        value: tax
      - type: text
        key: value
        value: "15"
      - type: text
        key: type
        value: number
      - type: text
        key: description
        value: نسبة  الضريبة المطبقة على الخدمات
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Thu, 30 Jul 2026 17:20:48 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "id": 9,
              "key": "tax",
              "value": "15",
              "type": "number",
              "description": "نسبة  الضريبة المطبقة على الخدمات",
              "updated_at": null
          },
          "message": "system setting created successfully",
          "status_code": 200,
          "timestamp": "2026-07-30T17:20:48+00:00"
      }
order: 1000
