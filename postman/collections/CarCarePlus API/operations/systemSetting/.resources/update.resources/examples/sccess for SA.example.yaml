    Date: Thu, 30 Jul 2026 17:23:02 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "id": 1,
              "key": "tax_percentage",
              "value": "15",
