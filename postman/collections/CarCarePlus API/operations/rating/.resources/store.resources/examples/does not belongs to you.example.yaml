$kind: http-example
request:
  url: "{{base_url}}/api/ratings"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: order_id
        value: "62"
      - type: text
        key: service_rating
        value: "3"
      - type: text
        key: employee_rating
        value: "1"
        disabled: true
      - type: text
        key: workshop_rating
        value: "1"
        disabled: true
      - type: text
        key: comment
        value: ""
      - type: text
        key: image_urls[0]
        value: ""
        disabled: true
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Wed, 12 Aug 2026 18:59:18 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 0,
          "data": "",
          "message": "strings.You do not have the required authorization",
          "status_code": 403,
          "timestamp": "2026-08-12T21:59:18+03:00"
      }
order: 3000
