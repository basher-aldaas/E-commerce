$kind: http-request
url: "{{base_url}}/api/points/transactions/4"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: points
      value: "100000"
    - type: text
      key: notes
      value: ndnd
      disabled: true
auth:
  type: bearer
  credentials:
    token: "{{super-token}}"
examples: ./.resources/add point manual to customer.resources/examples
order: 5000
