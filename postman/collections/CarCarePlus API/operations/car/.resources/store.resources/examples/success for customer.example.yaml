$kind: http-example
request:
  url: "{{base_url}}/api"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: user_id
        value: "4"
      - type: text
        key: brand_id
        value: "13"
      - type: text
        key: car_type_id
        value: "1"
      - type: text
        key: plate_number
        value: utt-3944
      - type: text
        key: model
        value: cvAccent
      - type: text
        key: year
        value: "2018"
      - type: text
        key: color
        value: red
      - type: text
        key: fuel_type
        value: hybrid
      - type: text
        key: cylinders
        value: "6"
      - type: text
        key: mileage
        value: "207002"
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Fri, 07 Aug 2026 16:52:44 GMT
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "id": 12,
              "user_id": 4,
              "brand_id": 13,
              "car_type_id": 1,
              "plate_number": "utt-3944",
              "model": "cvAccent",
              "year": 2018,
              "color": "red",
              "fuel_type": "hybrid",
              "cylinders": 6,
              "mileage": 207002,
              "image_url": null,
              "is_active": false,
              "created_at": "2026-08-07",
              "updated_at": "2026-08-07"
          },
          "message": "Car added successfully",
          "status_code": 200,
          "timestamp": "2026-08-07T16:52:44+00:00"
      }
order: 2000
