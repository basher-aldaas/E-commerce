$kind: http-example
request:
  url: "{{base_url}}/api/1"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: user_id
        value: "4"
      - type: text
        key: brand_id
        value: "13"
      - type: text
        key: car_type_id
        value: "1"
      - type: text
        key: plate_number
        value: utt-3945
      - type: text
        key: model
        value: cvAccent
      - type: text
        key: year
        value: "2018"
      - type: text
        key: color
        value: red
      - type: text
        key: fuel_type
        value: hybrid
      - type: text
        key: cylinders
        value: "6"
      - type: text
        key: mileage
        value: "207002"
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Fri, 07 Aug 2026 16:55:21 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "message": "Your account is inactive."
      }
order: 3000
