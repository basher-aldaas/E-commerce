$kind: http-example
request:
  url: "{{base_url}}/api/material-units/5"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: name
        value: liter update
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Fri, 31 Jul 2026 15:03:29 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "id": 5,
              "name": "liter update",
              "name_ar": "لتر",
              "is_decimal": false
          },
          "message": "material unit updated successfully",
          "status_code": 200,
          "timestamp": "2026-07-31T15:03:29+00:00"
      }
order: 1000
