$kind: http-request
url: "{{base_url}}/api/material-units"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: name
      value: letir
    - type: text
      key: name_ar
      value: لتر
auth:
  type: bearer
  credentials:
    token: "{{super-token}}"
examples: ./.resources/store.resources/examples
order: 3000
