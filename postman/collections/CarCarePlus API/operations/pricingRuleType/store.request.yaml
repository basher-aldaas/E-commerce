$kind: http-request
url: "{{base_url}}/api/pricing-rule-types"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: name
      value: extra mail
    - type: text
      key: name_ar
      value: ميل زيادة الاميال الثابتة
auth:
  type: bearer
  credentials:
    token: "{{admin}}"
examples: ./.resources/store.resources/examples
order: 3000
