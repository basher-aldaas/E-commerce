$kind: http-example
request:
  url: "{{base_url}}/api/pricing-rule-types/5"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: name
        value: extra mail from static mails
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Tue, 28 Jul 2026 19:57:15 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "id": 5,
              "name": "extra mail from static mails",
              "name_ar": "ميل زيادة الاميال الثابتة"
          },
          "message": "pricing rule type updated successfully",
          "status_code": 200,
          "timestamp": "2026-07-28T19:57:15+00:00"
      }
order: 1000
