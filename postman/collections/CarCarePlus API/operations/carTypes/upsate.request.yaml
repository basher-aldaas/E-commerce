$kind: http-request
url: "{{base_url}}/api/car-types/6"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: price_multiplier
      value: "1.8"
auth:
  type: bearer
  credentials:
    token: "{{super-token}}"
examples: ./.resources/upsate.resources/examples
order: 4000
