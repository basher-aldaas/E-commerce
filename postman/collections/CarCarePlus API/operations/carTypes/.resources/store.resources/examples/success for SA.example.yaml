$kind: http-example
request:
  url: "{{base_url}}/api/car-types"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: name
        value: cm
      - type: text
        key: name_ar
        value: قص
      - type: text
        key: price_multiplier
        value: "1.3"
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Fri, 31 Jul 2026 22:59:23 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "id": 6,
              "name": "cm",
              "name_ar": "قص",
              "price_multiplier": "1.30",
              "is_active": null,
              "created_at": "2026-07-31 22:59:23",
              "updated_at": "2026-07-31 22:59:23"
          },
          "message": "Car type created successfully",
          "status_code": 200,
          "timestamp": "2026-07-31T22:59:23+00:00"
      }
order: 1000
