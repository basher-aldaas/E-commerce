$kind: http-request
url: "{{base_url}}/api/package-service-sub-services"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: package_service_id
      value: "1"
    - type: text
      key: sub_service_id
      value: "1"
auth:
  type: bearer
  credentials:
    token: "{{super-token}}"
examples: ./.resources/store.resources/examples
order: 3000
