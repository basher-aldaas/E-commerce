$kind: http-request
url: "{{base_url}}/api/problem-types"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: name
      value: tire
    - type: text
      key: name_ar
      value: اطار
auth:
  type: bearer
  credentials:
    token: "{{super-token}}"
examples: ./.resources/store.resources/examples
order: 3000
