$kind: http-example
request:
  url: "{{base_url}}/api/ai-rules"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: name
        value: Oil Change Reminder
      - type: text
        key: name_ar
        value: تذكير تغيير الزيت
      - type: text
        key: type
        value: maintenance
      - type: text
        key: condition_key
        value: mileage
      - type: text
        key: condition_value
        value: "1000"
      - type: text
        key: brand_id
        value: "1"
      - type: text
        key: car_type
        value: sedan
      - type: text
        key: fuel_type
        value: petrol
      - type: text
        key: response_template
        value: Your vehicle may be due for an oil change.
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Thu, 30 Jul 2026 16:30:30 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "id": 3,
              "brand_id": 1,
              "name": "Oil Change Reminder",
              "name_ar": "تذكير تغيير الزيت",
              "type": "maintenance",
              "condition_key": "mileage",
              "condition_value": "1000",
              "car_type": "sedan",
              "fuel_type": "petrol",
              "response_template": "Your vehicle may be due for an oil change.",
              "is_active": null
          },
          "message": "ai rule created successfully",
          "status_code": 200,
          "timestamp": "2026-07-30T16:30:30+00:00"
      }
order: 1000
