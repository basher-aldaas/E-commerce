$kind: http-request
url: "{{base_url}}/api/ai-rules"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: name
      value: Oil Change Reminder
    - type: text
      key: name_ar
      value: تذكير تغيير الزيت
    - type: text
      key: type
      value: maintenance
    - type: text
      key: condition_key
      value: mileage
    - type: text
      key: condition_value
      value: "1000"
    - type: text
      key: brand_id
      value: "1"
    - type: text
      key: car_type
      value: sedan
    - type: text
      key: fuel_type
      value: petrol
    - type: text
      key: response_template
      value: Your vehicle may be due for an oil change.
auth:
  type: bearer
  credentials:
    token: "{{super-token}}"
examples: ./.resources/store.resources/examples
order: 3000
