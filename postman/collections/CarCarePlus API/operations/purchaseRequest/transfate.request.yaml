$kind: http-request
url: "{{base_url}}/api/purchase-requests/transfer"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: from_branch_id
      value: "3"
    - type: text
      key: to_branch_id
      value: "2"
    - type: text
      key: notes
      value: ""
      disabled: true
    - type: text
      key: items[0][material_id]
      value: "1"
    - type: text
      key: items[0][quantity]
      value: "10"
auth:
  type: bearer
  credentials:
    token: "{{super-token}}"
order: 7000
