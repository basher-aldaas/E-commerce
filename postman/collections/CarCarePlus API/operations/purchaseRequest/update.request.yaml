$kind: http-request
url: "{{base_url}}/api/purchase-requests/7"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: items[0][material_id]
      value: "1"
    - type: text
      key: items[0][quantity]
      value: "50"
    - type: text
      key: items[0][unit_price]
      value: "20"
auth:
  type: bearer
  credentials:
    token: "{{admin}}"
examples: ./.resources/update.resources/examples
order: 4000
