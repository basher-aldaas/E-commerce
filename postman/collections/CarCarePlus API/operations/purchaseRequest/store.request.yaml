$kind: http-request
url: "{{base_url}}/api/purchase-requests"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: notes
      value: ""
    - type: text
      key: items[0][material_id]
      value: "1"
    - type: text
      key: items[0][quantity]
      value: "10"
    - type: text
      key: items[0][unit_price]
      value: "20"
    - type: text
      key: items[1][material_id]
      value: "2"
    - type: text
      key: items[1][quantity]
      value: "5"
    - type: text
      key: items[1][unit_price]
      value: "20"
auth:
  type: bearer
  credentials:
    token: "{{admin}}"
examples: ./.resources/store.resources/examples
order: 3000
