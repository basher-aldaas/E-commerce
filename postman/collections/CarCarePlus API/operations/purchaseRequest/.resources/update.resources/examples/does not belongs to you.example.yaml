$kind: http-example
request:
  url: "{{base_url}}/api/purchase-requests/7"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: items[0][material_id]
        value: "1"
      - type: text
        key: items[0][quantity]
        value: "50"
      - type: text
        key: items[0][unit_price]
        value: "20"
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Fri, 14 Aug 2026 14:06:27 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 0,
          "data": [],
          "message": "You are not authorized to modify this purchase request.",
          "status_code": 403,
          "timestamp": "2026-08-14T17:06:27+03:00"
      }
order: 3000
