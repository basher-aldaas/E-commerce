$kind: http-example
request:
  url: "{{base_url}}/api/inventory-transactions"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: branch_id
        value: "2"
      - type: text
        key: material_id
        value: "1"
      - type: text
        key: type
        value: out
      - type: text
        key: quantity
        value: "1"
      - type: text
        key: destination_branch_id
        value: "2"
        disabled: true
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Fri, 31 Jul 2026 14:35:50 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "id": 18,
              "branch_id": 2,
              "destination_branch_id": null,
              "material_id": 1,
              "created_by": 1,
              "type": "out",
              "quantity": "1.00",
              "quantity_before": "52.00",
              "quantity_after": "51.00",
              "reference_id": null,
              "note": null,
              "created_at": null
          },
          "message": "inventory transaction recorded successfully",
          "status_code": 200,
          "timestamp": "2026-07-31T14:35:50+00:00"
      }
order: 3000
