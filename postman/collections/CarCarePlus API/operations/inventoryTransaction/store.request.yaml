$kind: http-request
url: "{{base_url}}/api/inventory-transactions"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: branch_id
      value: "2"
      disabled: true
    - type: text
      key: material_id
      value: "1"
    - type: text
      key: type
      value: transfer_out
    - type: text
      key: quantity
      value: "70"
    - type: text
      key: destination_branch_id
      value: "1"
      disabled: true
auth:
  type: bearer
  credentials:
    token: "{{admin}}"
examples: ./.resources/store.resources/examples
order: 3000
