$kind: http-example
request:
  url: "{{base_url}}/api/car-brands"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: name
        value: to
      - type: text
        key: ""
        value: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Fri, 31 Jul 2026 23:00:08 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "id": 15,
              "name": "to",
              "logo": null,
              "is_active": null,
              "created_at": "2026-07-31 23:00:08",
              "updated_at": "2026-07-31 23:00:08"
          },
          "message": "Car brand created successfully",
          "status_code": 200,
          "timestamp": "2026-07-31T23:00:08+00:00"
      }
order: 1000
