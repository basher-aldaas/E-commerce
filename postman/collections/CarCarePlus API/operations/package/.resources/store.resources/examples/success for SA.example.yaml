$kind: http-example
request:
  url: "{{base_url}}/api/packages"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: name
        value: name
      - type: text
        key: description
        value: description
      - type: text
        key: type
        value: monthly
      - type: text
        key: price
        value: "50"
      - type: text
        key: services_count
        value: "5"
      - type: text
        key: valid_days
        value: "30"
      - type: text
        key: is_company_package
        value: "0"
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Wed, 05 Aug 2026 17:34:28 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "id": 5,
              "name": "name",
              "description": "description",
              "type": "monthly",
              "is_company_package": false,
              "price": "50.00",
              "discount_pct": null,
              "services_count": 5,
              "valid_days": 30,
              "is_active": false,
              "created_at": "2026-08-05 17:34:28",
              "updated_at": "2026-08-05 17:34:28"
          },
          "message": "Package created successfully",
          "status_code": 200,
          "timestamp": "2026-08-05T17:34:28+00:00"
      }
order: 1000
