$kind: http-request
url: "{{base_url}}/api/packages"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: name
      value: name
    - type: text
      key: description
      value: description
    - type: text
      key: type
      value: monthly
    - type: text
      key: price
      value: "50"
    - type: text
      key: services_count
      value: "5"
    - type: text
      key: valid_days
      value: "30"
    - type: text
      key: is_company_package
      value: "0"
auth:
  type: bearer
  credentials:
    token: "{{super-token}}"
examples: ./.resources/store.resources/examples
order: 3000
