$kind: http-request
url: "{{base_url}}/api/suggested-problems"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: name
      value: tier
    - type: text
      key: name_ar
      value: اطار
    - type: text
      key: description
      value: change tier
    - type: text
      key: category
      value: tires
auth:
  type: bearer
  credentials:
    token: "{{super-token}}"
examples: ./.resources/store.resources/examples
order: 3000
