$kind: http-example
request:
  url: "{{base_url}}/api/suggested-problems"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: name
        value: tier
      - type: text
        key: name_ar
        value: اطار
      - type: text
        key: description
        value: change tier
      - type: text
        key: category
        value: tires
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Thu, 30 Jul 2026 17:35:30 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "id": 4,
              "name": "tier",
              "name_ar": "اطار",
              "description": "change tier",
              "category": "tires"
          },
          "message": "suggested problem created successfully",
          "status_code": 200,
          "timestamp": "2026-07-30T17:35:30+00:00"
      }
order: 1000
