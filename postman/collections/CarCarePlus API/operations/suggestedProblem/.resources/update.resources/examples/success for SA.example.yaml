$kind: http-example
request:
  url: "{{base_url}}/api/suggested-problems/4"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: description
        value: update
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Thu, 30 Jul 2026 17:36:36 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "id": 4,
              "name": "tier",
              "name_ar": "اطار",
              "description": "update",
              "category": "tires"
          },
          "message": "suggested problem updated successfully",
          "status_code": 200,
          "timestamp": "2026-07-30T17:36:36+00:00"
      }
order: 1000
