$kind: http-example
request:
  url: "{{base_url}}/api/inventories"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: branch_id
        value: "7"
      - type: text
        key: material_id
        value: "2"
      - type: text
        key: quantity
        value: "34"
      - type: text
        key: min_quantity
        value: "2"
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Fri, 31 Jul 2026 12:23:34 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 0,
          "data": {
              "branch_id": [
                  "The branch id has already been taken."
              ]
          },
          "message": "The branch id has already been taken.",
          "status_code": 422,
          "timestamp": "2026-07-31T12:23:34+00:00"
      }
order: 3000
