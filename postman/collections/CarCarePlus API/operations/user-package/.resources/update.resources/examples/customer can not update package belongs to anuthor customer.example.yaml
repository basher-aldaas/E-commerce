$kind: http-example
request:
  url: "{{base_url}}/api/user-packages/update/1"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: remaining_count
        value: "3"
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Tue, 28 Jul 2026 13:08:54 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 0,
          "data": null,
          "message": "Unauthorized",
          "status_code": 403,
          "timestamp": "2026-07-28T13:08:54+00:00"
      }
order: 2000
