$kind: http-example
request:
  url: "{{base_url}}/api/user-packages/update/1"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: remaining_count
        value: "3"
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Tue, 28 Jul 2026 13:08:31 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "id": 1,
              "user_id": 28,
              "package_id": 1,
              "start_date": "2026-07-24",
              "end_date": "2026-08-24",
              "remaining_count": 3,
              "status": "active",
              "created_at": "2026-07-28 14:40:00"
          },
          "message": "User package updated successfully",
          "status_code": 200,
          "timestamp": "2026-07-28T13:08:31+00:00"
      }
order: 1000
