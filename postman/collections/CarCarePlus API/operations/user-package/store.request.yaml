$kind: http-request
url: "{{base_url}}/api/user-packages"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: package_id
      value: "1"
auth:
  type: bearer
  credentials:
    token: "{{customer1-token}}"
examples: ./.resources/store.resources/examples
order: 3000
