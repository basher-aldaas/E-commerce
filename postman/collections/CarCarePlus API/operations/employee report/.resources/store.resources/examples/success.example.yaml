$kind: http-example
request:
  url: "{{base_url}}/api/employee-reports"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: order_id
        value: "1"
      - type: text
        key: problem_description
        value: less oil
      - type: text
        key: affected_parts[0]
        value: oil
      - type: text
        key: images[0[
        value: ""
        disabled: true
      - type: text
        key: recommendation
        value: ""
        disabled: true
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Tue, 18 Aug 2026 05:36:53 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "id": 1,
              "order_id": 1,
              "employee_id": 1,
              "problem_description": "less oil",
              "affected_parts": [
                  "oil"
              ],
              "images": null,
              "recommendation": null,
              "status": "pending",
              "reviewed_at": null,
              "created_at": null
          },
          "message": "employee report created successfully",
          "status_code": 200,
          "timestamp": "2026-08-18T08:36:53+03:00"
      }
order: 1000
