$kind: http-request
url: "{{base_url}}/api/employee-reports"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: order_id
      value: "1"
    - type: text
      key: problem_description
      value: less oil
    - type: text
      key: affected_parts[0]
      value: oil
    - type: text
      key: images[0[
      value: ""
      disabled: true
    - type: text
      key: recommendation
      value: ""
      disabled: true
auth:
  type: bearer
  credentials:
    token: "{{washer-token}}"
examples: ./.resources/store.resources/examples
order: 3000
