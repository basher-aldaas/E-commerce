$kind: http-request
url: "{{base_url}}/api/categories"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: name
      value: Car Wash
    - type: text
      key: name_ar
      value: غسيل سيارات
    - type: text
      key: description
      value: تنظيف وتلميع السيارات الداخلي والخارجي
auth:
  type: bearer
  credentials:
    token: "{{super-token}}"
examples: ./.resources/store.resources/examples
order: 2000
