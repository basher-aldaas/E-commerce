$kind: http-example
request:
  url: "{{base_url}}/api/categories"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: "{\r

      \    \"name\":\"Engine\",\r

      \    \"name_ar\":\"المحرك\",\r

      \    \"description\":\"Engine maintenance\",\r

      \    \"is_active\":true\r

      }"
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.30
    Cache-Control: no-cache, private
    Date: Fri, 17 Jul 2026 20:48:15 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: text
    content: |-
      {
          "status": 1,
          "data": {
              "id": 5,
              "name": "Engine",
              "name_ar": "المحرك",
              "description": "Engine maintenance",
              "is_active": true,
              "created_at": "2026-07-17 20:48:15",
              "updated_at": "2026-07-17 20:48:15"
          },
          "message": "Category created successfully",
          "status_code": 200,
          "timestamp": "2026-07-17T20:48:15+00:00"
      }
order: 1000
