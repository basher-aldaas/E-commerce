$kind: http-request
url: "{{base_url}}/api/bookings/confirm"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: quote_token
      value: a3003152-8120-4925-bcb9-0bd7b1f0e55d
auth:
  type: bearer
  credentials:
    token: "{{customer1-token}}"
examples: ./.resources/confirm booking.resources/examples
order: 4000
