$kind: http-example
name: success for SA, or Admin for order in his branch or for employee maintanence for his orders
request:
  url: "{{base_url}}/api/bookings/43/towing-detail/destination"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: destination_lat
        value: "20"
      - type: text
        key: destination_lng
        value: "20"
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Sat, 15 Aug 2026 14:51:20 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": {
              "id": 2,
              "order_id": 43,
              "car_type_size": "suv",
              "destination_lat": "20.0000000",
              "destination_lng": "20.0000000",
              "destination_address": "hole towen",
              "notes": "notes",
              "created_at": "2026-08-15T17:25:54+03:00"
          },
          "message": "Delivery destination coordinates submitted successfully",
          "status_code": 200,
          "timestamp": "2026-08-15T17:51:20+03:00"
      }
order: 2000
