$kind: http-example
request:
  url: "{{base_url}}/api/bookings/4/towing-detail/destination"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: destination_lat
        value: "20"
      - type: text
        key: destination_lng
        value: "20"
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Sat, 15 Aug 2026 14:50:40 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 0,
          "data": [],
          "message": "This booking has no towing detail.",
          "status_code": 404,
          "timestamp": "2026-08-15T17:50:40+03:00"
      }
order: 1000
