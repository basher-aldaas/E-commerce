$kind: http-request
url: "{{base_url}}/api/bookings/quote"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: car_ids[0]
      value: "10"
    - type: text
      key: service_id
      value: "3"
    - type: text
      key: booking_type
      value: "1"
    - type: text
      key: payment_method
      value: cash
    - type: text
      key: user_package_id
      value: "9"
      disabled: true
    - type: text
      key: scheduled_at
      value: 20-10-2026
      disabled: true
    - type: text
      key: location_lat
      value: "24"
    - type: text
      key: location_lng
      value: "46"
    - type: text
      key: branch_id
      value: "3"
      disabled: true
    - type: text
      key: location_address
      value: alepo
      disabled: true
    - type: text
      key: is_vip
      value: "1"
    - type: text
      key: sub_service_ids[0]
      value: "4"
      disabled: true
    - type: text
      key: sub_service_ids[1]
      value: "2"
      disabled: true
    - type: text
      key: materials[0][material_id]
      value: "1"
    - type: text
      key: materials[0][quantity]
      value: "5"
    - type: text
      key: notes
      value: notes
    - type: text
      key: workshop_id
      value: "2"
auth:
  type: bearer
  credentials:
    token: "{{customer1-token}}"
examples: ./.resources/submit booking personal.resources/examples
order: 3000
