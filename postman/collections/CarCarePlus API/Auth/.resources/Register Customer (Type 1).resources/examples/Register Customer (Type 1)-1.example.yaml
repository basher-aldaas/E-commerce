$kind: http-example
name: Register Customer (Type 1)
request:
  url: "{{base_url}}/api/auth/register/customer"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: name
        value: bashirقق
      - type: text
        key: email
        value: bashir2.d.aldaasقق@gmail.com
      - type: text
        key: phone
        value: "0994875924"
      - type: text
        key: password
        value: "11111111"
      - type: text
        key: password_confirmation
        value: "11111111"
      - type: text
        key: is_active
