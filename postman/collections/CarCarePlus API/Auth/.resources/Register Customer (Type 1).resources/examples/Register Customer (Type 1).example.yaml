    type: formdata
    content:
      - type: text
        key: name
        value: bashir
      - type: text
        key: email
        value: bashir2.d.aldaas@gmail.com
      - type: text
        key: phone
        value: "0994875922"
      - type: text
        key: password
        value: "11111111"
      - type: text
        key: password_confirmation
        value: "11111111"
