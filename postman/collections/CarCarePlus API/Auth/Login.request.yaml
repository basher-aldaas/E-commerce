$kind: http-request
description: Log in and receive a Sanctum token. The token is saved to the `token` collection variable automatically.
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "email": "bash8547469i1r@gmail.com",
        "password": "1111111"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      const token = res?.data?.token;
      if (token) { pm.collectionVariables.set('token', token); console.log('token saved'); }
    language: text/javascript
examples: ./.resources/Login.resources/examples
order: 4000
