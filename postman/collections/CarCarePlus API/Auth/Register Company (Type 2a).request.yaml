$kind: http-request
description: Company customer submits a registration request. Pending super-admin approval (no token issued).
url: "{{base_url}}/api/auth/register/company"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "name": "Company Owner",
        "email": "company2@example.com",
        "phone": "0500000222",
        "password": "password123",
        "password_confirmation": "password123",
        "is_active": false,
        "company_name": "Acme Auto",
        "company_name_ar": "أكمي أوتو",
        "commercial_reg": "CR-1234562",
        "tax_number": "TAX-1234526",
        "company_address": "123 King Fahd Rd, Riyadh"
    }
examples: ./.resources/Register Company (Type 2a).resources/examples
order: 2000
