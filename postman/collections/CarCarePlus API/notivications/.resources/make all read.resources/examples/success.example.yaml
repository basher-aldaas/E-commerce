$kind: http-example
request:
  url: "{{base_url}}/api/notifications/read-all"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content: []
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Sun, 16 Aug 2026 16:31:24 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 1,
          "data": [],
          "message": "All notifications marked as read",
          "status_code": 200,
          "timestamp": "2026-08-16T19:31:24+03:00"
      }
order: 1000
