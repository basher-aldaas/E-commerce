url: "{{base_url}}/api/notifications/read-all"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content: []
auth:
  type: bearer
  credentials:
    token: "{{admin}}"
examples: ./.resources/make all read.resources/examples
order: 4000
