$kind: http-example
request:
  url: http://localhost:8000/api/v1/auth/register
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: name
        value: bashir
      - type: text
        key: email
        value: bashir@system.com
      - type: text
        key: password
        value: pasword123
      - type: text
        key: password_confirmation
        value: pasword123
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Wed, 28 Oct 2026 20:32:00 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "status": 0,
          "data": {
              "email": [
                  "The email has already been taken."
              ]
          },
          "message": "Validation failed",
          "status_code": 422,
          "timestamp": "2026-10-28T20:32:00+00:00"
      }
order: 2000
