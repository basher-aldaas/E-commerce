$kind: http-example
request:
  url: http://localhost:8000/api/v1/categories
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: formdata
    content:
      - type: text
        key: name
        value: clothes
      - type: text
        key: descreiption
        value: ""
        disabled: true
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.3.11
    Cache-Control: no-cache, private
    Date: Wed, 28 Oct 2026 21:18:57 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
          "message": "Unauthenticated."
      }
order: 1000
